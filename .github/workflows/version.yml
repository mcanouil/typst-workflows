name: Version

# Cuts a release from the default branch with mcanouil/release-actions. It
# bumps CITATION.cff and rolls CHANGELOG.md, pushes that commit as the GitHub
# App, then tags it vX.Y.Z, which never moves, and moves the rolling vX.Y and
# vX, which callers pin. The release body is the changelog section and the
# generated notes. Run by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: "Version"
        default: "minor"
        options:
          - "patch"
          - "minor"
          - "major"

permissions:
  contents: read

env:
  TAG_PREFIX: v

# Two runs at once would read the same latest tag and race over the rolling
# ones. Queue rather than cancel: a cancelled run can leave the bump pushed
# while the release is not.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    name: Cut the release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Refuse to tag anything but the default branch
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          echo "::error::Releases are cut from ${DEFAULT_BRANCH}, not ${REF_NAME}."
          exit 1

      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      # The default token cannot pass the pull request rule of the default
      # branch, so a missing App stops the run before anything is written.
      - name: Refuse to release without the App
        if: ${{ steps.token.outputs.source != 'app' }}
        shell: bash
        run: |
          echo "::error::The release pushes to the default branch as the GitHub App. Set the APP_ID variable and the APP_KEY secret, then dispatch this workflow again."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Every tag but no history, since the bump reads the latest tag with
          # git tag --list.
          fetch-depth: 1
          fetch-tags: true
          token: ${{ steps.token.outputs.token }}

      - name: Bump the version
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ inputs.version }}
          version-source: tag
          tag-prefix: ${{ env.TAG_PREFIX }}
          token: ${{ steps.token.outputs.token }}
          targets: |
            - file: CITATION.cff
              pattern: '^version: {version}$'
            - file: CITATION.cff
              pattern: '^date-released: "{date}"$'

      # The README tells callers which major to pin, and a @v{major} target
      # would also rewrite pins such as actions/checkout@v7. A major cut
      # therefore lands its README change as an ordinary pull request first, and
      # this step makes forgetting that impossible.
      - name: Check the README pins the major being cut
        env:
          MAJOR: ${{ env.TAG_PREFIX }}${{ steps.bump.outputs.major }}
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(grep -oE "${GITHUB_REPOSITORY}/[^ \"]+@[^ \"]+" README.md \
            | sed 's/.*@//' | sort -u || true)"
          if [[ -z "${pinned}" ]]; then
            echo "::error::No typst-workflows reference found in README.md; expected the usage examples to pin ${MAJOR}."
            exit 1
          fi
          if [[ "${pinned}" != "${MAJOR}" ]]; then
            echo "::error::README.md pins $(tr '\n' ' ' <<<"${pinned}")but ${MAJOR} is being cut. Land a pull request repointing the usage examples at ${MAJOR}, then dispatch this workflow again."
            exit 1
          fi
          echo "README.md pins ${MAJOR}."

      # The App is exempt from the pull request rule of the default branch, and
      # the [skip ci] of the release message keeps CI from running again on a
      # tree it has checked.
      - name: Push the version
        id: push
        uses: mcanouil/release-actions/land@v1
        with:
          mode: push
          files: ${{ steps.bump.outputs.files }}
          version: ${{ steps.bump.outputs.version }}
          tag-prefix: ${{ env.TAG_PREFIX }}

      - name: Compose the release body
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          notes-file: ${{ steps.bump.outputs.notes-file }}
          version: ${{ steps.bump.outputs.version }}
          tag: ${{ env.TAG_PREFIX }}${{ steps.bump.outputs.version }}
          target: ${{ steps.push.outputs.sha }}
          generate-notes: true
          token: ${{ steps.token.outputs.token }}

      # Lightweight tags, deliberately: GitHub does not peel an annotated tag to
      # its commit when it resolves a relative workflow reference.
      - name: Create the release
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ steps.bump.outputs.version }}
          tag-prefix: ${{ env.TAG_PREFIX }}
          body-file: ${{ steps.notes.outputs.body-file }}
          target: ${{ steps.push.outputs.sha }}
          latest: true
          rolling: true
          token: ${{ steps.token.outputs.token }}

      # A new dispatch would stop on the emptied Unreleased section, and then on
      # the existing changelog heading, so the pushed bump has to go first.
      - name: Explain the recovery
        if: ${{ failure() && steps.push.outputs.sha != '' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          SHA: ${{ steps.push.outputs.sha }}
        shell: bash
        run: |
          echo "::error::${GITHUB_REF_NAME} holds the bump ${SHA} for ${TAG_PREFIX}${VERSION}, but the run failed after the push. If release ${TAG_PREFIX}${VERSION} does not exist, revert that commit with a pull request, then dispatch this workflow again. If it exists, only the rolling tags are missing: move them to ${SHA} by hand."

name: Release

# Writes the next version on the default branch with mcanouil/release-actions,
# builds the package archives at that commit, keeps them in a draft GitHub
# Release, and opens the Typst Universe pull request from those archives. The
# Publish workflow turns the draft into the release once Typst Universe serves
# the version.
on:
  workflow_call:
    inputs:
      bump:
        type: string
        required: true
      targets:
        type: string
        default: ""
      after-bump:
        type: string
        default: ""
      dry-run:
        type: boolean
        default: false
      needs-lua:
        type: boolean
        default: false
      needs-quarto:
        type: boolean
        default: false
      needs-imagemagick:
        type: boolean
        default: false
      check-args:
        type: string
        default: ""
      failure-artifacts:
        type: string
        default: ""
      shellcheck-paths:
        type: string
        default: "tools/*.sh .github/scripts/*.sh docs/_scripts/*.sh"
      shfmt-paths:
        type: string
        default: "tools/*.sh .github/scripts/*.sh"
      universe-fork:
        type: string
        default: "typst-universe-packages"
    outputs:
      version:
        value: ${{ jobs.plan.outputs.version }}

permissions:
  contents: read

# The bump targets of both jobs. The caller's list follows the typst.toml target
# as it is, so each of its items must start at column 0.
env:
  BUMP_TARGETS: |
    - file: typst.toml
      pattern: '^version = "{version}"$'
      source: true
    ${{ inputs.targets }}

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      date: ${{ steps.version.outputs.date }}
      state: ${{ steps.release.outputs.state }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the bump
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          case "${BUMP}" in
          patch | minor | major | none) ;;
          *)
            echo "::error::bump is '${BUMP}'. Use patch, minor, major, or none to resubmit the current draft."
            exit 1
            ;;
          esac

      - name: Set up Lua
        if: ${{ inputs.bump != 'none' && inputs.after-bump != '' && inputs.needs-lua }}
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"

      # The bump and after-bump are tried and undone, so that an empty Unreleased
      # section, a target with no match, or a broken after-bump command stops
      # the run in seconds rather than after the checks.
      - name: Try the bump
        id: probe
        if: ${{ inputs.bump != 'none' }}
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ inputs.bump }}
          targets: ${{ env.BUMP_TARGETS }}
          after-bump: ${{ inputs.after-bump }}

      - name: Undo the bump
        if: ${{ inputs.bump != 'none' }}
        shell: bash
        run: git checkout -- .

      - name: Work out the version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          PROBE_VERSION: ${{ steps.probe.outputs.version }}
          PROBE_DATE: ${{ steps.probe.outputs.date }}
        run: |
          set -euo pipefail
          name="$(awk -F'"' '/^name[[:space:]]*=/ { print $2; exit }' typst.toml)"
          if [[ "${BUMP}" == "none" ]]; then
            version="$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' typst.toml)"
            date=""
          else
            version="${PROBE_VERSION}"
            date="${PROBE_DATE}"
          fi
          {
            echo "name=${name}"
            echo "version=${version}"
            echo "date=${date}"
          } >>"${GITHUB_OUTPUT}"
          echo "Releasing ${name} ${version}."

      # The release job pushes the version as the App, so a missing App stops
      # here rather than after the checks. A dry run pushes nothing.
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          require-app: ${{ !inputs.dry-run }}

      - name: Find the release
        id: release
        uses: mcanouil/typst-workflows/actions/find-release@v2
        with:
          version: ${{ steps.version.outputs.version }}
          asset: ${{ steps.version.outputs.name }}-${{ steps.version.outputs.version }}.tar.gz
          token: ${{ steps.token.outputs.token }}

      # A resubmission after the merge on typst/packages would replace the draft
      # with bytes that Typst Universe does not serve.
      - name: Ask Typst Universe
        id: served
        if: ${{ inputs.bump == 'none' }}
        uses: mcanouil/typst-workflows/actions/universe-served@v2
        with:
          name: ${{ steps.version.outputs.name }}
          version: ${{ steps.version.outputs.version }}

      # bump none on a version with no release finishes a run that pushed the
      # bump and then stopped, so the version must already have its notes.
      - name: Read the release notes
        id: notes
        if: ${{ inputs.bump == 'none' }}
        uses: mcanouil/release-actions/notes@v1
        with:
          version: ${{ steps.version.outputs.version }}
          section-heading: ""

      - name: Check the release state
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          STATE: ${{ steps.release.outputs.state }}
          SERVED: ${{ steps.served.outputs.served }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.notes.outputs.body-file }}
        run: |
          set -euo pipefail
          if [[ "${BUMP}" != "none" && "${STATE}" != "none" ]]; then
            echo "::error::A ${STATE} release ${VERSION} already exists. Dispatch with bump none to resubmit a draft, or delete the draft to start again."
            exit 1
          fi
          if [[ "${BUMP}" == "none" ]]; then
            if [[ "${STATE}" == "published" ]]; then
              echo "::error::${VERSION} is already published, so there is nothing to resubmit. Dispatch with patch, minor or major."
              exit 1
            fi
            if [[ "${SERVED}" == "true" ]]; then
              echo "::error::Typst Universe already serves ${NAME}:${VERSION}, so a resubmission would change bytes it has accepted. Run Publish instead."
              exit 1
            fi
            if [[ ! -s "${NOTES}" ]]; then
              echo "::error::The ${VERSION} section of CHANGELOG.md is empty. Add the notes under its heading, then dispatch again."
              exit 1
            fi
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} exists with no published release. Delete the tag, or publish its release by hand, then dispatch again."
            exit 1
          fi

  checks:
    name: Checks
    needs: plan
    uses: mcanouil/typst-workflows/.github/workflows/checks.yml@v2
    with:
      needs-lua: ${{ inputs.needs-lua }}
      needs-quarto: ${{ inputs.needs-quarto }}
      needs-imagemagick: ${{ inputs.needs-imagemagick }}
      check-args: ${{ inputs.check-args }}
      failure-artifacts: ${{ inputs.failure-artifacts }}
      shellcheck-paths: ${{ inputs.shellcheck-paths }}
      shfmt-paths: ${{ inputs.shfmt-paths }}

  release:
    name: Write the version and draft the release
    needs: [plan, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.land.outputs.sha || github.sha }}
    env:
      DRY_RUN: ${{ inputs.dry-run }}
      NAME: ${{ needs.plan.outputs.name }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Set up Lua
        if: ${{ inputs.needs-lua }}
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"

      # The checks ran on the dispatched commit, so the release refuses any other.
      - name: Refuse a moved branch
        shell: bash
        run: |
          set -euo pipefail
          head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ "${head}" != "${GITHUB_SHA}" ]]; then
            echo "::error::${GITHUB_REF_NAME} moved from ${GITHUB_SHA} to ${head} after the dispatch, so the checks did not see ${head}. Dispatch the release again."
            exit 1
          fi

      # The commit stays on the runner until the notes and the archives are
      # built, so that a failure there leaves the branch as it was. The date is
      # the plan's, so that a run across midnight writes one date.
      - name: Write the version
        id: bump
        if: ${{ inputs.bump != 'none' }}
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ inputs.bump }}
          date: ${{ needs.plan.outputs.date }}
          targets: ${{ env.BUMP_TARGETS }}
          after-bump: ${{ inputs.after-bump }}

      - name: Check the version
        if: ${{ inputs.bump != 'none' }}
        shell: bash
        env:
          BUMPED: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${BUMPED}" != "${VERSION}" ]]; then
            echo "::error::The bump wrote ${BUMPED}, but the plan job worked out ${VERSION}. Dispatch the release again."
            exit 1
          fi

      # With bump none there is no notes-file, so the section is read from the
      # changelog by version.
      - name: Read the release notes
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          notes-file: ${{ steps.bump.outputs.notes-file }}
          version: ${{ needs.plan.outputs.version }}
          section-heading: ""

      - name: Build the package archives
        shell: bash
        run: |
          set -euo pipefail
          tools/package.sh archive "${RUNNER_TEMP}/assets"
          for ext in tar.gz zip; do
            if [[ ! -f "${RUNNER_TEMP}/assets/${NAME}-${VERSION}.${ext}" ]]; then
              echo "::error::tools/package.sh archive wrote no ${NAME}-${VERSION}.${ext}. The repository contract in mcanouil/typst-workflows describes its output."
              exit 1
            fi
          done
          # The universe job reads the notes from the artefact, for the body of
          # the pull request.
          cp "${NOTES}" "${RUNNER_TEMP}/assets/notes.md"
        env:
          NOTES: ${{ steps.notes.outputs.body-file }}

      - name: Upload the archives
        uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: ${{ runner.temp }}/assets
          retention-days: 7

      # The App bypasses the pull request rule of the default branch, and
      # [skip ci] keeps the checks and the docs from running on a tree that the
      # checks job has already seen. A dry run keeps the bump on the runner.
      - name: Push the version
        id: land
        if: ${{ inputs.bump != 'none' && !inputs.dry-run }}
        uses: mcanouil/release-actions/land@v1
        with:
          mode: push
          files: ${{ steps.bump.outputs.files }}
          version: ${{ needs.plan.outputs.version }}

      # From here, the version is on the branch. If this step fails, dispatch
      # with bump none, which creates the missing draft.
      - name: Draft the release
        if: ${{ !inputs.dry-run && needs.plan.outputs.state == 'none' }}
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ needs.plan.outputs.version }}
          body-file: ${{ steps.notes.outputs.body-file }}
          title: "{version}"
          target: ${{ steps.land.outputs.sha || github.sha }}
          draft: true
          assets: |
            ${{ runner.temp }}/assets/${{ needs.plan.outputs.name }}-${{ needs.plan.outputs.version }}.tar.gz#${{ needs.plan.outputs.name }} ${{ needs.plan.outputs.version }} (tar.gz)
            ${{ runner.temp }}/assets/${{ needs.plan.outputs.name }}-${{ needs.plan.outputs.version }}.zip#${{ needs.plan.outputs.name }} ${{ needs.plan.outputs.version }} (zip)
          token: ${{ steps.token.outputs.token }}

      # release-actions does not edit drafts, so a resubmission moves the draft
      # and replaces its assets here.
      - name: Update the draft
        if: ${{ !inputs.dry-run && needs.plan.outputs.state == 'draft' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ steps.land.outputs.sha || github.sha }}
          NOTES: ${{ steps.notes.outputs.body-file }}
        run: |
          set -euo pipefail
          gh release edit "${VERSION}" --target "${SHA}" --notes-file "${NOTES}"
          gh release upload "${VERSION}" --clobber \
            "${RUNNER_TEMP}/assets/${NAME}-${VERSION}.tar.gz#${NAME} ${VERSION} (tar.gz)" \
            "${RUNNER_TEMP}/assets/${NAME}-${VERSION}.zip#${NAME} ${VERSION} (zip)"

      - name: Summary
        shell: bash
        env:
          SHA: ${{ steps.land.outputs.sha || github.sha }}
        run: |
          {
            echo "## Release ${NAME} ${VERSION}"
            echo ""
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "- Dry run: nothing pushed, no draft. The archives are in the \`release-archives\` artefact."
            else
              echo "- Commit: \`${SHA}\`"
              echo "- Draft: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

  universe:
    name: Submit to Typst Universe
    needs: [plan, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: typst-universe
    env:
      NAME: ${{ needs.plan.outputs.name }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # One token for this repository, whose draft holds the archive, and for
      # the fork, which the App syncs and pushes to.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            ${{ inputs.universe-fork }}

      # The git identity of the App, for the commit on the fork. The token
      # above stays, because it reaches the fork as well as this repository.
      - name: Set up the Git user
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      # The notes, and in a dry run the archives too. A real run then replaces
      # the archive with the one in the draft.
      - name: Download the release artefact
        uses: actions/download-artifact@v8
        with:
          name: release-archives
          path: ${{ runner.temp }}/assets

      - name: Find the draft release
        if: ${{ !inputs.dry-run }}
        id: draft
        uses: mcanouil/typst-workflows/actions/find-release@v2
        with:
          version: ${{ needs.plan.outputs.version }}
          asset: ${{ needs.plan.outputs.name }}-${{ needs.plan.outputs.version }}.tar.gz
          token: ${{ steps.app-token.outputs.token }}

      # The submitted bytes are the bytes of the draft release.
      - name: Download the archive of the draft release
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ASSET_ID: ${{ steps.draft.outputs.asset-id }}
        run: |
          set -euo pipefail
          if [[ -z "${ASSET_ID}" ]]; then
            echo "::error::The draft release ${VERSION} has no ${NAME}-${VERSION}.tar.gz. Dispatch the release again with bump none."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/assets"
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            >"${RUNNER_TEMP}/assets/${NAME}-${VERSION}.tar.gz"

      - name: Set up Typst
        uses: mcanouil/typst-workflows/actions/setup-typst@v2

      - name: Set up typst-package-check
        uses: mcanouil/typst-workflows/actions/setup-package-check@v2

      - name: Extract the archive
        shell: bash
        run: |
          set -euo pipefail
          check="${RUNNER_TEMP}/check"
          mkdir -p "${check}/${NAME}"
          tar -xzf "${RUNNER_TEMP}/assets/${NAME}-${VERSION}.tar.gz" -C "${check}"
          mv "${check}/${NAME}-${VERSION}" "${check}/${NAME}/${VERSION}"

      - name: Fill the Typst package cache
        uses: mcanouil/typst-workflows/actions/fill-package-cache@v2
        with:
          package: ${{ runner.temp }}/check/${{ needs.plan.outputs.name }}/${{ needs.plan.outputs.version }}
          name: ${{ needs.plan.outputs.name }}
          version: ${{ needs.plan.outputs.version }}

      - name: Lint the archive
        shell: bash
        run: |
          set -euo pipefail
          typst-package-check check "${RUNNER_TEMP}/check/${NAME}/${VERSION}"

      - name: Submit
        id: submit
        uses: mcanouil/typst-workflows/actions/universe-submit@v2
        with:
          name: ${{ needs.plan.outputs.name }}
          version: ${{ needs.plan.outputs.version }}
          archive: ${{ runner.temp }}/assets/${{ needs.plan.outputs.name }}-${{ needs.plan.outputs.version }}.tar.gz
          fork: ${{ github.repository_owner }}/${{ inputs.universe-fork }}
          fork-token: ${{ steps.app-token.outputs.token }}
          pr-token: ${{ secrets.UNIVERSE_TOKEN }}
          notes: ${{ runner.temp }}/assets/notes.md
          dry-run: ${{ inputs.dry-run }}

      - name: Summary
        shell: bash
        env:
          BRANCH: ${{ steps.submit.outputs.branch }}
          PR_URL: ${{ steps.submit.outputs.pr-url }}
          FORK: ${{ github.repository_owner }}/${{ inputs.universe-fork }}
        run: |
          {
            echo "## Typst Universe"
            echo ""
            echo "- Branch: \`${FORK}:${BRANCH}\`"
            if [[ -n "${PR_URL}" ]]; then
              echo "- Pull request: ${PR_URL}"
              echo "- Next: run Publish once Typst Universe serves ${NAME}:${VERSION}."
            else
              echo "- Dry run: nothing was pushed and no pull request was opened. The job log holds the body."
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

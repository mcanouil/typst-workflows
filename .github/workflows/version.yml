name: Version

# Cuts a release from the default branch with mcanouil/release-actions. It
# bumps CITATION.cff and rolls CHANGELOG.md, pushes that commit as the GitHub
# App, then tags it vX.Y.Z, which never moves, and moves the rolling vX.Y and
# vX, which callers pin. The release body is the changelog section and the
# generated notes. Run by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: "Version"
        default: "minor"
        options:
          - "patch"
          - "minor"
          - "major"

permissions:
  contents: read

env:
  TAG_PREFIX: v

# Two runs at once would read the same latest tag and race over the rolling
# ones. Queue rather than cancel: a cancelled run can leave the bump pushed
# while the release is not.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    name: Cut the release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          # The default token cannot pass the pull request rule of the default
          # branch, so a missing App stops the run before anything is written.
          require-app: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Every tag but no history, since the bump reads the latest tag with
          # git tag --list.
          fetch-depth: 1
          fetch-tags: true
          token: ${{ steps.token.outputs.token }}

      - name: Bump the version
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ inputs.version }}
          version-source: tag
          tag-prefix: ${{ env.TAG_PREFIX }}
          token: ${{ steps.token.outputs.token }}
          targets: |
            - file: CITATION.cff
              pattern: '^version: {version}$'
            - file: CITATION.cff
              pattern: '^date-released: "{date}"$'
            # The usage examples pin the major being cut. Each pattern names a
            # workflow of this repository, so pins such as actions/checkout@v7
            # stay as they are.
            - file: README.md
              pattern: 'typst-workflows/.github/workflows/checks.yml@v{major}'
            - file: README.md
              pattern: 'typst-workflows/.github/workflows/docs.yml@v{major}'
            - file: README.md
              pattern: 'typst-workflows/.github/workflows/release.yml@v{major}'
            - file: README.md
              pattern: 'typst-workflows/.github/workflows/publish.yml@v{major}'

      # The App is exempt from the pull request rule of the default branch, and
      # the [skip ci] of the release message keeps CI from running again on a
      # tree it has checked.
      - name: Push the version
        id: push
        uses: mcanouil/release-actions/land@v1
        with:
          mode: push
          files: ${{ steps.bump.outputs.files }}
          version: ${{ steps.bump.outputs.version }}
          tag-prefix: ${{ env.TAG_PREFIX }}

      - name: Compose the release body
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          notes-file: ${{ steps.bump.outputs.notes-file }}
          version: ${{ steps.bump.outputs.version }}
          tag: ${{ env.TAG_PREFIX }}${{ steps.bump.outputs.version }}
          target: ${{ steps.push.outputs.sha }}
          generate-notes: true
          token: ${{ steps.token.outputs.token }}

      # Lightweight tags, deliberately: GitHub does not peel an annotated tag to
      # its commit when it resolves a relative workflow reference.
      - name: Create the release
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ steps.bump.outputs.version }}
          tag-prefix: ${{ env.TAG_PREFIX }}
          body-file: ${{ steps.notes.outputs.body-file }}
          target: ${{ steps.push.outputs.sha }}
          latest: true
          rolling: true
          token: ${{ steps.token.outputs.token }}

name: Publish

# Publishes the draft release of the version on the default branch, once Typst
# Universe serves that version. GitHub creates the tag at the draft's target
# commit as it publishes. The caller deploys the documentation afterwards.
on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.publish.outputs.version }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Refuse another branch
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::Publish runs from ${DEFAULT_BRANCH}, not ${REF_NAME}. Dispatch it from ${DEFAULT_BRANCH}."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          echo "name=$(awk -F'"' '/^name[[:space:]]*=/ { print $2; exit }' typst.toml)" >>"${GITHUB_OUTPUT}"
          echo "version=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' typst.toml)" >>"${GITHUB_OUTPUT}"

      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      # The default token cannot see a draft release, so without the App the
      # draft would look missing.
      - name: Refuse to publish without the App
        if: ${{ steps.token.outputs.source != 'app' }}
        shell: bash
        run: |
          echo "::error::Publish reads the draft release as the GitHub App. Set the APP_ID variable and the APP_KEY secret, and pass them with secrets: inherit, then dispatch Publish again."
          exit 1

      - name: Find the release
        id: release
        uses: mcanouil/typst-workflows/actions/find-release@v2
        with:
          version: ${{ steps.version.outputs.version }}
          asset: ${{ steps.version.outputs.name }}-${{ steps.version.outputs.version }}.tar.gz
          token: ${{ steps.token.outputs.token }}

      - name: Ask Typst Universe
        id: served
        if: ${{ steps.release.outputs.state == 'draft' }}
        uses: mcanouil/typst-workflows/actions/universe-served@v2
        with:
          name: ${{ steps.version.outputs.name }}
          version: ${{ steps.version.outputs.version }}

      - name: Publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          STATE: ${{ steps.release.outputs.state }}
          ID: ${{ steps.release.outputs.id }}
          TARGET: ${{ steps.release.outputs.target }}
          SERVED: ${{ steps.served.outputs.served }}
        run: |
          set -euo pipefail
          case "${STATE}" in
          published)
            echo "::notice::${VERSION} is already published, so only the documentation deploys."
            ;;
          none)
            echo "::error::There is no draft release for ${VERSION}, the version in typst.toml. Run the Release workflow first."
            exit 1
            ;;
          draft)
            if [[ "${SERVED}" != "true" ]]; then
              echo "::error::Typst Universe does not serve ${NAME}:${VERSION} yet. Run Publish again once the typst/packages pull request has merged and packages.typst.org lists the version."
              exit 1
            fi
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${ID}" \
              -F draft=false -f make_latest=true >/dev/null
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" --jq .sha)"
            if [[ "${tag_sha}" != "${TARGET}" ]]; then
              echo "::error::Tag ${VERSION} points at ${tag_sha}, not at ${TARGET}, the target of the draft. Check the release page before anything else."
              exit 1
            fi
            ;;
          esac
          {
            echo "## Publish ${NAME} ${VERSION}"
            echo ""
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"
          } >>"${GITHUB_STEP_SUMMARY}"

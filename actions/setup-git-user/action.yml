name: Set up the Git user
description: Make Git commit as the GitHub App that owns the token.

inputs:
  token:
    description: "The App token, from actions/create-github-app-token."
    required: true
  app-slug:
    description: "The App slug, from actions/create-github-app-token."
    required: true

runs:
  using: composite
  steps:
    - name: Configure the Git user
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        APP_SLUG: ${{ inputs.app-slug }}
      run: |
        set -euo pipefail
        user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
        git config --global user.name "${APP_SLUG}[bot]"
        git config --global user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
